<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Alina · symbole « soleil-disque » : un vinyle qui se couche sur Tana.
       Moitié haute = le soleil (ambre), trois bandes = ses reflets sur l'eau et les sillons du disque (braise). -->
  <defs><clipPath id="disc"><circle cx="50" cy="50" r="46"/></clipPath></defs>
  <g clip-path="url(#disc)">
    <rect x="0" y="0" width="100" height="53" fill="#ffb020"/>
    <g fill="#ff5a1f">
      <rect x="0" y="58" width="100" height="9"/>
      <rect x="0" y="73" width="100" height="8"/>
      <rect x="0" y="87" width="100" height="7"/>
    </g>
  </g>
</svg>
